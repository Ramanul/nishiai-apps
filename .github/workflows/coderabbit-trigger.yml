# Pornește automat review-ul CodeRabbit. Pe repo-uri publice cu <10 stele,
# CodeRabbit nu face review automat; răspunde doar la comanda din comentariu.
name: CodeRabbit auto-trigger

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

jobs:
  trigger:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Comentează @coderabbitai review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr comment "$PR" --repo "$REPO" --body "@coderabbitai review" \
            || { echo "::warning::Nu am putut posta comentariul de trigger"; exit 0; }
